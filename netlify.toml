[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev:vite -- --host 127.0.0.1"
  targetPort = 5173
  port = 8888
  autoLaunch = false

[[redirects]]
  from = "/api/geocode"
  to = "/.netlify/functions/geocode"
  status = 200

[[redirects]]
  from = "/api/nws"
  to = "/.netlify/functions/nws"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
